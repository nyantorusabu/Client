<!doctype html>
<html lang="ja" data-nyaitter-ui="nui">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow, noarchive" />
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com https://pagead2.googlesyndication.com; frame-src 'self' https://challenges.cloudflare.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https:; media-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; worker-src 'self'; manifest-src 'self'" />
		<title>Nyaitter</title>
		<meta name="theme-color" content="#1d9bf0" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="manifest" href="./manifest.webmanifest" />
		<link rel="icon" href="favicon.png" type="image/png" />
		<link rel="apple-touch-icon" sizes="180x180" href="pwa-icon-192.png" />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/emojione@4.0.0/extras/css/emojione.min.css"
			integrity="sha384-+JoywCPFwbtS2KrNLFu8EJHK+r5KPfqww25+fIBceLuhRk4muZy4TZR/4gXrk3qX"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
		<style>
			#loading-overlay {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				background: var(--loading-color, rgba(255, 255, 255, 0.9));
				display: flex;
				flex-direction: column;
				gap: 16px;
				justify-content: center;
				align-items: center;
				z-index: 99999;
			}
			.boot-status {
				min-height: 1.2em;
				font-size: 0.9rem;
				color: var(--nui-text, #333);
			}
			.boot-progress {
				width: min(280px, 70vw);
				height: 4px;
				border-radius: 9999px;
				background: rgba(0, 0, 0, 0.12);
				overflow: hidden;
			}
			.boot-progress-bar {
				height: 100%;
				width: 0%;
				background: var(--nui-accent, var(--primary-color, #ff9900));
				transition: width 0.2s ease;
			}
			#loading-overlay.hidden {
				display: none !important;
			}
			#loading-overlay .spinner {
				border: 4px solid var(--spin, rgba(0, 0, 0, 0.1));
				border-left-color: var(--nui-accent, var(--primary-color, #ff9900));
				width: 44px;
				height: 44px;
				border-radius: 50%;
				animation: spin 1s ease infinite;
			}
			@keyframes spin {
				0% { transform: rotate(0deg); }
				100% { transform: rotate(360deg); }
			}
		</style>
		<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" integrity="sha384-o28+zJO3/45GHIy+9TFKGaYnbt0KQcFRzyBrb0WSSrz7bPGwGI1d64worBiXPgXw" crossorigin="anonymous"></script>
		<script src="./config.js"></script>
		<script src="./i18n.js"></script>
		<script src="./bootstrap.js"></script>
	</head>
	<body>
		<!-- 初期ロード表示 -->
		<div id="loading-overlay" role="status" aria-live="polite" aria-label="読み込み中" data-i18n-aria-label="common.loading" aria-hidden="false" aria-busy="true"><div class="spinner"></div><div id="boot-status" class="boot-status"></div><div id="boot-progress" class="boot-progress" hidden><div id="boot-progress-bar" class="boot-progress-bar"></div></div></div>

		<!-- 動的マウント先 -->
		<div id="app-root"></div>

		<!-- スクリプト -->
	</body>
</html>
